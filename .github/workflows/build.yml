name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    branches:
      - 'master'

env:
  SOLUTION_NAME: MotionTrackingMKIIPlusforAviUtl2

jobs:
  build:
    name: Build
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download OpenCV LICENSE
        run: |
          curl https://raw.githubusercontent.com/opencv/opencv/4.13.0/LICENSE -o opencv.txt
          curl https://raw.githubusercontent.com/opencv/opencv_contrib/4.13.0/LICENSE -o opencv_contrib.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: '2.2.1'

      - name: Set up Conan
        run: |
          poetry install
          poetry run conan profile detect --force

      - name: Install Make
        run:
          choco install make

      - name: Set version
        run: |
          (Get-Content src\constants.hpp -Raw) -replace '\$\{ver\}', '${{ github.ref_name }}' | Set-Content src\constants.hpp

      - name: Build
        run: |
          cd ${{ github.workspace }}
          cd src
          make compile

      - name: Pack into a folder
        run: |
          cd ${{ github.workspace }}
          mkdir pack
          mkdir pack\Licenses

          # 本体
          Copy-Item src\build\build\Release\${{ env.SOLUTION_NAME }}.aux2 pack

          # MTMK2 のライセンスのファイル名を変えて複製
          Copy-Item LICENSE ${{ env.SOLUTION_NAME }}.txt
          Copy-Item ${{ env.SOLUTION_NAME }}.txt pack\Licenses\${{ env.SOLUTION_NAME }}.txt

          # AviUtl のSDKライセンス
          Copy-Item Licenses\aviutl_plugin_sdk.txt pack\Licenses

          # AviUtl2 のSDKライセンス
          Copy-Item src\aviutl2_sdk\license.txt pack\Licenses

          # OpenCV のライセンス
          Copy-Item opencv.txt pack\Licenses
          Copy-Item opencv_contrib.txt pack\Licenses

          # README
          Copy-Item README.ja.md pack
          Copy-Item README.md pack

      - name:  Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: pack\*
          name: ${{ env.SOLUTION_NAME }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compress
        run: |
          cd artifacts
          zip -r ../${{ env.SOLUTION_NAME }}.zip *

      - name: Prepare release notes
        run: |
          awk '/^## '"${{ github.ref_name }}"'$/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > ReleaseNotes.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.zip'
          body_path: ReleaseNotes.txt
